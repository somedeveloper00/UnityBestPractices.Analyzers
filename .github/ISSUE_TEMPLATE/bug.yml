name: Bug report
description: Report an analyzer, quick-fix, packaging, or compatibility defect.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Analyzer version
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: unity
    attributes:
      label: Unity, IDE, and package versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include compilable source and exact steps where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
