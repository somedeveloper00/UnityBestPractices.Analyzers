name: Build and release

on:
  push:
    branches:
      - master

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test-release:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: 0.${{ github.run_number }}
      BUILD_VERSION: 0.${{ github.run_number }}.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UnityBestPractices.sln

      - name: Build
        run: >
          dotnet build UnityBestPractices.sln
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:Version="$BUILD_VERSION"

      - name: Run tests
        run: >
          dotnet run
          --project tests/UnityBestPractices.Analyzers.Tests/UnityBestPractices.Analyzers.Tests.csproj
          --configuration Release
          --no-build

      - name: Prepare versioned DLL
        shell: bash
        run: |
          source_dll="src/UnityBestPractices.Analyzers/bin/Release/netstandard2.0/UnityBestPractices.Analyzers.dll"
          mkdir -p release
          cp "$source_dll" "release/UnityBestPractices.Analyzers-v${RELEASE_VERSION}.dll"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${RELEASE_VERSION}"
          asset_path="release/UnityBestPractices.Analyzers-${release_tag}.dll"
          gh release create "$release_tag" "$asset_path" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_tag" \
            --generate-notes \
            --fail-on-no-commits
