name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    name: Build and publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce fresh licensed Unity matrix evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '7 days ago' +%s)"
          evidence=''
          while IFS=$'\t' read -r sha created url event; do
            [[ "$(date -u -d "$created" +%s)" -ge "$cutoff" ]] || continue
            if [[ "$event" == 'workflow_dispatch' && "$sha" == "$GITHUB_SHA" ]] || \
               { [[ "$event" == 'schedule' ]] && git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; }; then
              evidence="$url"
              break
            fi
          done < <(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?status=success&per_page=50" \
            --jq '.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | [.head_sha, .created_at, .html_url, .event] | @tsv')
          if [[ -z "$evidence" ]]; then
            echo 'No successful scheduled CI matrix was found on a recent ancestor (maximum age: 7 days).' >&2
            echo 'Manually run CI with licensed credentials before releasing.' >&2
            exit 1
          fi
          echo "Using licensed Unity evidence: $evidence"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Verify tag and project versions match
        id: version
        shell: bash
        run: |
          project_version="$(dotnet msbuild src/UnityBestPractices.Analyzers/UnityBestPractices.Analyzers.csproj -getProperty:Version)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$project_version"
          echo "value=$project_version" >> "$GITHUB_OUTPUT"

      - name: Restore through shared validation entry point
        shell: pwsh
        run: ./eng/Invoke-Validation.ps1 -Stages Restore

      - name: Run canonical stability validation
        shell: pwsh
        run: ./eng/Invoke-Validation.ps1 -SkipRestore

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          mkdir -p release
          cp src/UnityBestPractices.Analyzers/bin/Release/netstandard2.0/UnityBestPractices.Analyzers.dll release/
          cp artifacts/packages/*.nupkg release/
          cp artifacts/packages/*.snupkg release/
          tar -czf "release/com.somedeveloper.unity-best-practices-analyzers-${{ steps.version.outputs.value }}.tgz" \
            -C artifacts/upm package
          (
            cd release
            sha256sum UnityBestPractices.Analyzers.dll *.nupkg *.snupkg *.tgz > SHA256SUMS
          )

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Publish to NuGet.org when configured
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push
          "artifacts/packages/UnityBestPractices.Analyzers.${{ steps.version.outputs.value }}.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
