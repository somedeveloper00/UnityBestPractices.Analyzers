name: Build

on:
  push:
    branches-ignore:
      - master

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UnityBestPractices.sln

      - name: Build
        run: >
          dotnet build UnityBestPractices.sln
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: >
          dotnet run
          --project tests/UnityBestPractices.Analyzers.Tests/UnityBestPractices.Analyzers.Tests.csproj
          --configuration Release
          --no-build
